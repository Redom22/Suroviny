<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graz Groupe | Suroviny a Výrobky</title>
    <style>
        :root { --primary: #1e40af; --primary-light: #3b82f6; --bg: #f0f5f9; --card-bg: #ffffff; --text-main: #1e293b; --text-muted: #64748b; --border: #e2e8f0; --success: #10b981; --danger: #ef4444; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); line-height: 1.6; }
        header { background: var(--card-bg); padding: 1rem 5%; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; border-bottom: 3px solid var(--primary); }
        .logo { font-size: 1.6rem; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 0.6rem; text-transform: uppercase; }
        .logo span { background: var(--primary); color: white; padding: 0.3rem 0.9rem; border-radius: 8px; }
        nav { display: flex; gap: 0.5rem; }
        nav button { background: transparent; border: none; font-size: 1rem; font-weight: 600; color: var(--text-muted); padding: 0.5rem 1rem; cursor: pointer; border-radius: 6px; }
        nav button.active { background: var(--primary); color: white; }
        main { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
        .card { background: var(--card-bg); padding: 1.5rem; border-radius: 12px; border: 1px solid var(--border); }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal { background: var(--card-bg); padding: 2rem; border-radius: 16px; width: 90%; max-width: 600px; position: relative; }
        .success-msg { text-align: center; padding: 2rem; }
        .order-number-large { font-size: 1.5rem; font-weight: 900; color: var(--primary); margin: 1rem 0; padding: 1rem; background: var(--bg); border: 2px dashed var(--primary); }
        .hidden { display: none !important; }
        .submit-btn { width: 100%; background: var(--success); color: white; border: none; padding: 1rem; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 1rem; }
        form input { width: 100%; padding: 0.8rem; margin-bottom: 1rem; border: 1px solid var(--border); border-radius: 8px; }
    </style>
</head>
<body>

<header>
    <div class="logo"><span>G</span> Graz Groupe</div>
    <nav>
        <button id="btn-suroviny" class="active" onclick="switchTab('suroviny')">Suroviny</button>
        <button id="btn-vyrobky" onclick="switchTab('vyrobky')">Výrobky</button>
        <button class="cart-btn" onclick="openCart()">Košík (<span id="cart-count">0</span>)</button>
    </nav>
</header>

<main>
    <div id="tab-suroviny" class="tab-content active"><div id="grid-suroviny" class="grid"></div></div>
    <div id="tab-vyrobky" class="tab-content"><div id="grid-vyrobky" class="grid"></div></div>
</main>

<div id="cart-modal" class="modal-overlay">
    <div class="modal">
        <div id="cart-content">
            <h2>Košík</h2>
            <div id="cart-items"></div>
            <button id="checkout-btn" class="submit-btn" onclick="showCheckoutForm()">Přejít k pokladně</button>
        </div>
        <form id="checkout-form" class="hidden" onsubmit="submitOrder(event)">
            <h3>Objednávka</h3>
            <input type="text" id="fname" placeholder="Jméno" required>
            <input type="text" id="lname" placeholder="Příjmení" required>
            <input type="text" id="postic" placeholder="post.ic" required>
            <input type="text" id="phone" placeholder="Telefon" required>
            <button type="submit" class="submit-btn">Závazně objednat</button>
        </form>
        <div id="success-message" class="hidden success-msg">
            <h2 style="color: var(--success);">Objednávka úspěšně zaslána!</h2>
            <p>V případě storna kontaktujte: <strong>noemi.graziani@post.ic</strong></p>
            <div class="order-number-large" id="final-order-num"></div>
            <button class="submit-btn" onclick="location.reload()">Zavřít</button>
        </div>
    </div>
</div>

<script>
    // VLOŽ SEM SVŮJ WEBHOOK
    const DISCORD_WEBHOOK = 'https://discord.com/api/webhooks/1509569723355103262/eT2CT_5ezEQ4rrEL-L_C4WTv_-Hq3pxw0ml-5pRuAE-HtHhbbNLhFXE4yqJ_2WP8l7u3';

    const produkty = [
        { id: 1, name: 'Železná ruda', type: 'suroviny', price: 1500, stock: 45 },
        { id: 2, name: 'Dřevo', type: 'suroviny', price: 800, stock: 120 },
        { id: 5, name: 'Ocelový meč', type: 'vyrobky', price: 15000, stock: 5 }
    ];
    let cart = [];
    let currentOrderNumber = '';

    function switchTab(t) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.getElementById('tab-' + t).classList.add('active');
    }

    function renderProducts(type) {
        const grid = document.getElementById(`grid-${type}`);
        grid.innerHTML = produkty.filter(p => p.type === type).map(p => `
            <div class="card">
                <h3>${p.name}</h3>
                <p>${p.price} $</p>
                <button onclick="addToCart(${p.id})">Do košíku</button>
            </div>
        `).join('');
    }

    function addToCart(id) {
        const p = produkty.find(p => p.id === id);
        cart.push({ product: p, qty: 1 });
        document.getElementById('cart-count').innerText = cart.length;
    }

    function openCart() { document.getElementById('cart-modal').style.display = 'flex'; }
    function showCheckoutForm() {
        currentOrderNumber = 'OBJ-' + Math.floor(100000 + Math.random() * 900000);
        document.getElementById('cart-content').classList.add('hidden');
        document.getElementById('checkout-form').classList.remove('hidden');
    }

    async function submitOrder(e) {
        e.preventDefault();
        const payload = {
            embeds: [{
                title: "Nová objednávka: " + currentOrderNumber,
                fields: [{ name: "Zákazník", value: document.getElementById('fname').value + " " + document.getElementById('lname').value }]
            }]
        };

        try {
            const res = await fetch(DISCORD_WEBHOOK, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (res.ok || res.status === 204) {
                document.getElementById('checkout-form').classList.add('hidden');
                document.getElementById('success-message').classList.remove('hidden');
                document.getElementById('final-order-num').innerText = "Vaše číslo objednávky je: " + currentOrderNumber;
            } else {
                alert('Chyba při odesílání.');
            }
        } catch (err) {
            alert('Nelze odeslat objednávku.');
        }
    }

    renderProducts('suroviny');
    renderProducts('vyrobky');
</script>
</body>
</html>
