<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graz Groupe | Suroviny a Výrobky</title>
    <style>
        :root {
            --primary: #1e40af; --primary-light: #3b82f6; --bg: #f0f5f9;
            --card-bg: #ffffff; --text-main: #1e293b; --text-muted: #64748b;
            --border: #e2e8f0; --success: #10b981; --danger: #ef4444;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); line-height: 1.6; }
        header { background: var(--card-bg); padding: 1rem 5%; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; border-bottom: 3px solid var(--primary); }
        .logo { font-size: 1.6rem; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 0.6rem; text-transform: uppercase; }
        .logo span { background: linear-gradient(135deg, var(--primary), var(--primary-light)); color: white; padding: 0.3rem 0.9rem; border-radius: 8px; font-size: 1.5rem; font-weight: 900; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; padding: 2rem; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal { background: var(--card-bg); padding: 2rem; border-radius: 16px; width: 90%; max-width: 650px; position: relative; }
        .close-btn { position: absolute; top: 1.5rem; right: 1.5rem; background: var(--bg); border: none; width: 35px; height: 35px; border-radius: 50%; cursor: pointer; }
        .submit-btn { width: 100%; background: var(--success); color: white; border: none; padding: 1rem; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 1rem; }
        .hidden { display: none !important; }
        .success-box { text-align: center; padding: 2rem; }
        .success-box h2 { color: var(--success); margin-bottom: 1rem; }
    </style>
</head>
<body>

<header>
    <div class="logo"><span>G</span> Graz Groupe</div>
    <nav><button onclick="openCart()">Košík (<span id="cart-count">0</span>)</button></nav>
</header>

<main>
    <div id="tab-suroviny" class="tab-content active"><div id="grid-suroviny" class="grid"></div></div>
</main>

<div id="cart-modal" class="modal-overlay">
    <div class="modal">
        <button class="close-btn" onclick="closeCart()">✕</button>
        
        <!-- Obsah košíku -->
        <div id="cart-content">
            <h2 style="color: var(--primary);">Váš košík</h2>
            <div id="cart-items"></div>
            <button id="checkout-btn" class="submit-btn" onclick="showCheckoutForm()">Přejít k pokladně</button>
        </div>

        <!-- Formulář -->
        <form id="checkout-form" class="hidden" onsubmit="submitOrder(event)">
            <input type="text" id="fname" placeholder="Jméno" required style="width:100%; padding: 0.5rem; margin-bottom: 0.5rem;">
            <input type="text" id="lname" placeholder="Příjmení" required style="width:100%; padding: 0.5rem; margin-bottom: 0.5rem;">
            <input type="text" id="postic" placeholder="post.ic" required style="width:100%; padding: 0.5rem; margin-bottom: 0.5rem;">
            <input type="text" id="phone" placeholder="Telefon" required style="width:100%; padding: 0.5rem; margin-bottom: 1rem;">
            <button type="submit" class="submit-btn">Závazně objednat</button>
        </form>

        <!-- Úspěšná zpráva -->
        <div id="order-success-msg" class="success-box hidden">
            <h2>Objednávka úspěšně zaslána!</h2>
            <p>V případě storna kontaktujte: <strong>noemi.graziani@post.ic</strong></p>
            <p style="margin-top: 1rem;">Vaše číslo objednávky je: <br><strong id="final-order-num" style="font-size: 1.5rem; color: var(--primary);"></strong></p>
        </div>
    </div>
</div>

<script>
    const DISCORD_WEBHOOK = 'https://discord.com/api/webhooks/1509569723355103262/eT2CT_5ezEQ4rrEL-L_C4WTv_-Hq3pxw0ml-5pRuAE-HtHhbbNLhFXE4yqJ_2WP8l7u3';
    let cart = [];
    let currentOrderNumber = '';

    function openCart() { document.getElementById('cart-modal').style.display = 'flex'; }
    function closeCart() { document.getElementById('cart-modal').style.display = 'none'; }
    
    function showCheckoutForm() {
        document.getElementById('cart-content').classList.add('hidden');
        document.getElementById('checkout-form').classList.remove('hidden');
    }

    async function submitOrder(e) {
        e.preventDefault();
        currentOrderNumber = 'OBJ-' + Math.floor(100000 + Math.random() * 900000);
        
        // Zde probíhá fetch na Discord... (původní kód)
        
        // Po úspěchu:
        document.getElementById('checkout-form').classList.add('hidden');
        document.getElementById('order-success-msg').classList.remove('hidden');
        document.getElementById('final-order-num').innerText = currentOrderNumber;
        
        cart = []; // Vyprázdnit košík
        document.getElementById('cart-count').innerText = '0';
    }
</script>

</body>
</html>
