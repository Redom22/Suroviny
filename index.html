<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graz Groupe | Suroviny a Výrobky</title>
    <style>
        :root {
            --primary: #1e40af; --primary-light: #3b82f6; --bg: #f0f5f9;
            --card-bg: #ffffff; --text-main: #1e293b; --text-muted: #64748b;
            --border: #e2e8f0; --success: #10b981; --danger: #ef4444;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); line-height: 1.6; }
        header { background: var(--card-bg); padding: 1rem 5%; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; border-bottom: 3px solid var(--primary); }
        .logo { font-size: 1.6rem; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 0.6rem; }
        .logo span { background: linear-gradient(135deg, var(--primary), var(--primary-light)); color: white; padding: 0.3rem 0.9rem; border-radius: 8px; font-weight: 900; }
        nav { display: flex; gap: 0.5rem; }
        nav button { background: transparent; border: none; font-size: 1rem; font-weight: 600; color: var(--text-muted); padding: 0.5rem 1rem; cursor: pointer; border-radius: 6px; }
        nav button.active { background: var(--primary); color: white; }
        main { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
        .tab-content { display: none; } .tab-content.active { display: block; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
        .card { background: var(--card-bg); padding: 1.5rem; border-radius: 12px; border-top: 4px solid var(--primary-light); }
        .vedeni-box { background: white; max-width: 600px; margin: 0 auto; padding: 2rem; border-radius: 12px; text-align: center; border-top: 5px solid var(--primary); }
        .vedeni-info { margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 1rem; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal { background: white; padding: 2rem; border-radius: 16px; width: 90%; max-width: 500px; }
        .submit-btn { width: 100%; background: var(--success); color: white; border: none; padding: 1rem; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<header>
    <div class="logo"><span>G</span> Graz Groupe</div>
    <nav>
        <button id="btn-suroviny" class="active" onclick="switchTab('suroviny')">Suroviny</button>
        <button id="btn-vyrobky" onclick="switchTab('vyrobky')">Výrobky</button>
        <button id="btn-vedeni" onclick="switchTab('vedeni')">Vedení</button>
        <button onclick="openCart()">Košík (<span id="cart-count">0</span>)</button>
    </nav>
</header>

<main>
    <div id="tab-suroviny" class="tab-content active"><div id="grid-suroviny" class="grid"></div></div>
    <div id="tab-vyrobky" class="tab-content"><div id="grid-vyrobky" class="grid"></div></div>
    <div id="tab-vedeni" class="tab-content">
        <div class="vedeni-box">
            <h2>Vedení společnosti</h2>
            <div class="vedeni-info">
                <p><strong>Majitelka:</strong> Noemi Graziani</p>
                <p>noemi.graziani@post.ic</p>
            </div>
            <div class="vedeni-info">
                <p><strong>Manažer:</strong> Viktor Rossi</p>
                <p>viktor.rossi@post.ic</p>
            </div>
        </div>
    </div>
</main>

<div id="cart-modal" class="modal-overlay">
    <div class="modal">
        <form id="checkout-form" onsubmit="submitOrder(event)">
            <input type="text" id="fname" placeholder="Jméno" required style="width:100%; margin-bottom:10px; padding:10px;">
            <input type="text" id="postic" placeholder="E-mail (končící .ic)" required style="width:100%; margin-bottom:10px; padding:10px;">
            <input type="text" id="phone" placeholder="Telefon (přesně 6 číslic)" required style="width:100%; margin-bottom:15px; padding:10px;">
            <button type="submit" class="submit-btn">Odeslat objednávku</button>
            <button type="button" onclick="closeCart()" style="width:100%; margin-top:10px; border:none; background:none; cursor:pointer;">Zavřít</button>
        </form>
    </div>
</div>

<script>
    const DISCORD_WEBHOOK = 'SEM_VLOZ_ODKAZ';

    const produkty = [
        { id: 1, name: 'Železná ruda', type: 'suroviny', price: 1500, stock: 45 },
        { id: 5, name: 'Ocelový meč', type: 'vyrobky', price: 15000, stock: 5 }
    ];

    let cart = [];

    function switchTab(t) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.getElementById('tab-' + t).classList.add('active');
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-' + t).classList.add('active');
    }

    function render() {
        ['suroviny', 'vyrobky'].forEach(type => {
            const grid = document.getElementById('grid-' + type);
            grid.innerHTML = produkty.filter(p => p.type === type).map(p => `
                <div class="card">
                    <h3>${p.name}</h3>
                    <p>${p.price} $</p>
                    <button onclick="addToCart(${p.id})">Přidat</button>
                </div>
            `).join('');
        });
    }

    function addToCart(id) { cart.push(produkty.find(p => p.id === id)); document.getElementById('cart-count').innerText = cart.length; }
    function openCart() { document.getElementById('cart-modal').style.display = 'flex'; }
    function closeCart() { document.getElementById('cart-modal').style.display = 'none'; }

    async function submitOrder(e) {
        e.preventDefault();
        const postic = document.getElementById('postic').value;
        const phone = document.getElementById('phone').value;

        // Validace
        if (!postic.endsWith('.ic')) return alert('E-mail musí končit .ic');
        if (!/^\d{6}$/.test(phone)) return alert('Telefon musí obsahovat přesně 6 číslic');

        alert('Objednávka odeslána!');
        closeCart();
    }

    render();
</script>
</body>
</html>
